<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sobre mí</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8E2D2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sobre mí">
<link rel="apple-touch-icon" href="icono.png">

<style>
:root{
  --papel:#E8E2D2;
  --papel-hondo:#DED6C3;
  --papel-marcado:#D4CBB5;
  --tinta:#1C1B18;
  --tinta-media:#4A4741;
  --tinta-alta:#857F72;
  --tenue:#6B675C;
  --regla:#B4AE9C;
  --sello:#8C3A1E;
  --grano:0,0,0;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Roboto Mono", monospace;
  --display: "Avenir Next Condensed", "Helvetica Neue Condensed", "Arial Narrow", var(--mono);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--mono);
  font-size:14px;
  line-height:1.35;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image:
    radial-gradient(circle at 20% 15%, rgba(var(--grano),.025) 0 30%, transparent 60%),
    radial-gradient(circle at 85% 80%, rgba(var(--grano),.02) 0 25%, transparent 55%);
  background-attachment:fixed;
}

.envoltura{max-width:640px;margin:0 auto;padding:0 14px 44px}

.pestanas{
  display:flex;gap:0;border-bottom:1px solid var(--regla);
  position:sticky;top:0;z-index:11;background:var(--papel);
}
.pestanas a{
  flex:1;text-align:center;padding:12px 6px 10px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tenue);text-decoration:none;border-bottom:2px solid transparent;
}
.pestanas a.activa{color:var(--tinta);border-bottom-color:var(--sello)}

.sitios{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.sitios button{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;color:var(--tenue);border:1px solid var(--regla);
  padding:5px 9px;cursor:pointer;
}
.sitios button[aria-pressed="true"]{border-color:var(--tinta);color:var(--tinta)}

/* En pantalla estrecha manda el pulgar: menos adorno, más superficie
   tocable y nada de texto diminuto en los controles. */
@media (max-width:520px){
  .envoltura{padding:0 11px 44px}
  h1{font-size:22px}
  header{padding:10px 0 8px;margin-bottom:11px}
  .cuadro{padding:7px}
  .ruta{font-size:17px}
  .km{font-size:18px}
  .maquina,.telemetria{font-size:10px}
  .pie{gap:8px 10px}
  .pie button,.pie select{padding:9px 11px;font-size:10px}
  .sitios button{padding:8px 11px}
  .tira{grid-template-columns:5px 1fr auto}
  .cuerpo{padding:8px 9px}
  .medida{padding:8px 9px 8px 0}
  .detalle .rejilla{grid-template-columns:repeat(2,1fr)}
}

/* ---------- Cabecera ---------- */

header{
  position:sticky;top:0;z-index:10;
  background:var(--papel);
  padding:14px 0 10px;
  border-bottom:1px solid var(--regla);
  margin-bottom:14px;
}
.titulo-fila{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{
  font-family:var(--display);
  font-size:26px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;line-height:1;
}
.sitio{font-size:10px;color:var(--tenue);letter-spacing:.14em;
       text-transform:uppercase;margin-top:4px}
.estado{display:flex;align-items:center;gap:7px;font-size:10px;
        color:var(--tenue);letter-spacing:.1em;text-align:right}
.punto{width:7px;height:7px;border-radius:50%;background:var(--sello);flex:none}
.punto.vivo{animation:latido 2s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.punto.vivo{animation:none}}

/* ---------- Aviso y alerta ---------- */

.aviso{
  font-size:11px;color:var(--sello);
  border-left:2px solid var(--sello);padding:8px 11px;
  margin-bottom:14px;letter-spacing:.02em;
}
.alerta{
  background:var(--sello);color:var(--papel);
  padding:10px 13px;margin-bottom:14px;
  display:flex;align-items:baseline;gap:10px;
}
.alerta .grande{font-family:var(--display);font-size:19px;
                font-weight:600;letter-spacing:.05em}
.alerta .chico{font-size:10px;letter-spacing:.12em;
               text-transform:uppercase;opacity:.85}

/* ---------- Radar ---------- */

.cuadro{
  position:relative;background:var(--papel-hondo);
  border:1px solid var(--regla);padding:10px;margin-bottom:14px;
}
.cuadro svg{display:block;width:100%;height:auto}
.etiqueta-cuadro,.cuenta-cuadro{
  position:absolute;top:8px;font-size:9px;letter-spacing:.16em;
  color:var(--tenue);text-transform:uppercase;
}
.etiqueta-cuadro{left:12px}
.cuenta-cuadro{right:12px}
/* Atajo al quiosco donde se busca: sobre el propio radar, no
   enterrado entre ocho botones al final de la página. */
.expandir{
  position:absolute;bottom:10px;right:10px;z-index:5;
  width:34px;height:34px;line-height:1;
  font-family:var(--mono);font-size:15px;
  background:var(--papel);color:var(--tenue);
  border:1px solid var(--regla);cursor:pointer;
}
.expandir:hover{color:var(--tinta);border-color:var(--tinta)}
html[data-quiosco] .expandir{display:none}

/* ---------- Panel de detalle ---------- */

.detalle{
  border:1px solid var(--tinta);background:var(--papel-hondo);
  margin-bottom:14px;overflow:hidden;
}
.detalle .foto{width:100%;display:block;background:var(--papel-marcado)}
.detalle .credito{font-size:8px;color:var(--tenue);padding:3px 12px;
                  letter-spacing:.08em;text-transform:uppercase}
.detalle .interior{padding:12px}
.detalle h2{
  font-family:var(--display);font-size:24px;font-weight:600;
  letter-spacing:.04em;color:var(--sello);line-height:1.05;
}
.detalle .sub{font-size:11px;color:var(--tenue);margin-top:3px}
.rejilla{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  gap:9px 12px;margin-top:12px;padding-top:11px;border-top:1px solid var(--regla);
}
.dato .k{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.dato .v{font-size:15px;font-weight:600;margin-top:2px}
.cerrar{
  float:right;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  background:transparent;border:1px solid var(--regla);color:var(--tenue);
  padding:4px 8px;cursor:pointer;text-transform:uppercase;
}

/* ---------- Tiras ---------- */

.tiras{display:flex;flex-direction:column;gap:8px}
.tira{
  display:grid;grid-template-columns:6px 1fr auto;
  background:var(--papel-hondo);border:1px solid var(--regla);
  cursor:pointer;transition:background .12s ease;
}
.tira:hover{background:var(--papel-marcado)}
.tira:focus-visible{outline:2px solid var(--sello);outline-offset:2px}
.tira.marcada{background:var(--papel-marcado);border-color:var(--tinta)}
.canto{background:var(--tinta)}
/* La miniatura convierte una lista de códigos en una lista de
   aviones. Ocupa poco y cambia por completo cómo se lee. */
.tira.con-foto{grid-template-columns:6px 62px 1fr auto}
.mini{width:62px;align-self:stretch;background:var(--papel-marcado);
      overflow:hidden;display:flex;align-items:center;justify-content:center}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:520px){
  .tira.con-foto{grid-template-columns:5px 52px 1fr auto}
  .mini{width:52px}
}
.tira.baja .canto{background:var(--sello)}
.tira.encima .canto{background:repeating-linear-gradient(
  180deg,var(--sello) 0 4px,var(--papel-hondo) 4px 8px)}

.cuerpo{padding:9px 11px;min-width:0}
.ruta{
  font-family:var(--display);font-size:19px;font-weight:600;
  letter-spacing:.04em;color:var(--sello);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ruta .lugar{font-size:11px;color:var(--tenue);letter-spacing:.06em;margin-left:6px}
.maquina{font-size:11px;color:var(--tinta-media);margin-top:3px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.telemetria{font-size:10px;color:var(--tenue);margin-top:4px;letter-spacing:.03em}
.paso{color:var(--sello);font-weight:600}
.marca{
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;vertical-align:middle;margin-left:6px;
  border:1px solid currentColor;padding:1px 4px;
}
.m-mil{color:#2E4756}
.m-heli{color:#3F5D45}
.m-raro{color:var(--sello)}
.alerta.urgente{
  background:var(--tinta);
  border-left:5px solid var(--sello);
}
.perfil{margin-top:12px;padding-top:11px;border-top:1px solid var(--regla)}
.perfil .k{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--tenue);margin-bottom:5px}
.perfil svg{display:block;width:100%;height:52px}
.nuevo{
  font-family:var(--mono);font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;vertical-align:middle;margin-left:7px;
  border:1px solid var(--sello);color:var(--sello);padding:1px 4px;
}

.medida{padding:9px 11px 9px 0;text-align:right;display:flex;
        flex-direction:column;justify-content:center;flex:none}
.km{font-size:20px;font-weight:600;line-height:1}
.rumbo{font-size:9px;color:var(--tenue);letter-spacing:.12em;margin-top:3px}

/* ---------- Gráfica y pie ---------- */

.chispa{
  margin-top:16px;padding-top:12px;border-top:1px solid var(--regla);
}
.chispa .cab{display:flex;justify-content:space-between;
             font-size:9px;letter-spacing:.14em;text-transform:uppercase;
             color:var(--tenue);margin-bottom:6px}
.chispa svg{display:block;width:100%;height:44px}

.pie{
  margin-top:16px;padding-top:12px;border-top:1px solid var(--regla);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;
  font-size:10px;color:var(--tenue);letter-spacing:.1em;text-transform:uppercase;
}
.pie button,.pie select{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  background:transparent;color:var(--tenue);
  border:1px solid var(--regla);padding:5px 9px;cursor:pointer;
}
.pie a{color:var(--sello);text-decoration:none;
       border-bottom:1px solid var(--sello);padding-bottom:1px}
.pie button[aria-pressed="true"]{border-color:var(--tinta);color:var(--tinta)}
.pie button:focus-visible,.pie select:focus-visible{
  outline:2px solid var(--sello);outline-offset:2px}
.vacio{padding:26px 0;text-align:center;color:var(--tenue);font-size:12px}

/* ---------- Modo espectador ----------
   Solo en quiosco: cuando nadie toca nada, va pasando cromos de los
   aviones más interesantes. Un salvapantallas con datos. */
#espectador{display:none}
html[data-quiosco] #espectador.visible{
  display:flex;position:fixed;inset:0;z-index:25;
  background:var(--papel);
  align-items:center;justify-content:center;gap:36px;padding:5vh 6vw;
  animation:aparecer .6s ease;
}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  html[data-quiosco] #espectador.visible{animation:none}
}
#espectador .lamina{
  flex:0 1 46%;max-width:52vw;border:1px solid var(--regla);
  background:var(--papel-hondo);aspect-ratio:4/3;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
#espectador .lamina img{width:100%;height:100%;object-fit:cover}
#espectador .lamina span{font-size:12px;color:var(--tenue);letter-spacing:.1em}
#espectador .texto{flex:1 1 40%;min-width:0}
#espectador .motivo{font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--sello);margin-bottom:10px}
#espectador h2{font-family:var(--display);font-size:clamp(30px,6vw,64px);
  font-weight:600;letter-spacing:.04em;line-height:.98}
#espectador .mod{font-size:clamp(13px,1.8vw,20px);color:var(--tinta-media);margin-top:8px}
#espectador .ruta{font-size:clamp(13px,1.8vw,20px);color:var(--sello);margin-top:6px}
#espectador .datos{margin-top:18px;display:flex;gap:26px;flex-wrap:wrap}
#espectador .datos div{font-size:clamp(16px,2.4vw,28px);font-weight:600}
#espectador .datos small{display:block;font-size:10px;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);margin-bottom:2px}
@media (max-width:700px){
  html[data-quiosco] #espectador.visible{flex-direction:column;gap:18px}
  #espectador .lamina{flex:0 0 auto;width:76vw;max-width:none}
}

/* ---------- Modo quiosco ----------
   Todo fuera menos el radar. Pensado para un iPad viejo en una
   estantería: se mira de lejos, así que el dibujo manda y el texto
   se reduce a lo imprescindible. */
html[data-quiosco] body{overflow:hidden}
html[data-quiosco] .pestanas,
html[data-quiosco] header,
html[data-quiosco] .tiras,
html[data-quiosco] .chispa,
html[data-quiosco] .pie,
html[data-quiosco] #detalle,
html[data-quiosco] #aviso{display:none}
html[data-quiosco] .envoltura{
  max-width:none;padding:0;height:100vh;height:100dvh;
  display:flex;flex-direction:column;justify-content:center;
}
html[data-quiosco] .cuadro{
  border:none;background:transparent;margin:0;padding:0;
  display:flex;align-items:center;justify-content:center;
}
html[data-quiosco] .cuadro svg{
  width:min(96vw,96vh);height:auto;
}
html[data-quiosco] .etiqueta-cuadro,
html[data-quiosco] .cuenta-cuadro{font-size:12px;top:14px}
html[data-quiosco] .etiqueta-cuadro{left:18px}
html[data-quiosco] .cuenta-cuadro{right:18px}
html[data-quiosco] #alerta{
  position:fixed;left:0;right:0;bottom:0;margin:0;z-index:20;
}
html[data-quiosco] .alerta{padding:16px 20px}
html[data-quiosco] .alerta .grande{font-size:26px}
html[data-quiosco] .alerta .chico{font-size:12px}
#salirQuiosco{
  display:none;position:fixed;top:14px;right:14px;z-index:30;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;background:var(--papel-hondo);color:var(--tenue);
  border:1px solid var(--regla);padding:9px 12px;cursor:pointer;
}
html[data-quiosco] #salirQuiosco{display:block}

/* ---------- Modo noche ----------
   No es el papel invertido: es una carta náutica nocturna. La tinta
   se vuelve luz y el papel, la oscuridad de la mesilla. */
html[data-tema="noche"]{
  --papel:#12151A;
  --papel-hondo:#191D24;
  --papel-marcado:#232830;
  --tinta:#E4DED0;
  --tinta-media:#A9A395;
  --tinta-alta:#6E695E;
  --tenue:#7C776C;
  --regla:#333941;
  --sello:#D06A45;
  --grano:255,255,255;
}
html[data-tema="noche"] .alerta{color:#12151A}
html[data-tema="noche"] .alerta.urgente{background:#000;color:var(--tinta)}
html[data-tema="noche"] .detalle .foto{opacity:.9}
</style>
</head>

<body>
<div class="envoltura">

  <nav class="pestanas">
    <a href="index.html" class="activa">En vivo</a>
    <a href="historia.html">Historia</a>
    <a href="modelos.html">Modelos</a>
    <a href="comparar.html">Comparar</a>
    <a href="avion.html">Ficha</a>
  </nav>

  <header>
    <div class="titulo-fila">
      <div>
        <h1>Sobre mí</h1>
        <div class="sitio" id="sitio">—</div>
      </div>

        <span class="punto" id="punto"></span>
        <span id="estado">iniciando</span>
      </div>
    </div>
    <div class="sitios">
      <button id="bCasa" aria-pressed="true">Casa</button>
      <button id="bAqui" aria-pressed="false">Dónde estoy</button>
    </div>

  <button id="salirQuiosco">Salir</button>
  <div id="espectador"></div>

  <div id="aviso"></div>

  <div class="cuadro">
    <span class="etiqueta-cuadro">Vertical</span>
    <span class="cuenta-cuadro" id="cuenta">—</span>
    <button class="expandir" id="btnQuiosco2" title="Modo quiosco">⤢</button>
    <svg id="scope" viewBox="0 0 400 400" role="img"
         aria-label="Tráfico aéreo alrededor de tu posición"></svg>
  </div>

  <div id="detalle"></div>

  <div class="chispa">
    <div class="cab"><span>Tráfico · última media hora</span><span id="chispaMax">—</span></div>
    <svg id="grafica" viewBox="0 0 400 44" preserveAspectRatio="none"></svg>
  </div>

  <div class="pie">
    <span id="vistos">0 vistos</span>
    <span id="servidor"></span>
    <a href="historia.html">Historia →</a>
    <span id="version">—</span>
    <label>Radio
      <select id="radio">
        <option value="10">10 km</option>
        <option value="25">25 km</option>
        <option value="50" selected>50 km</option>
        <option value="100">100 km</option>
        <option value="200">200 km</option>
      </select>
    </label>
    <label>Ver
      <select id="filtro">
        <option value="todos">Todos</option>
        <option value="bajos">Bajo 10.000 ft</option>
        <option value="acercandose">Se acercan</option>
        <option value="raros">Militares y helis</option>
        <option value="nuevos">Nunca vistos</option>
      </select>
    </label>
    <button id="btnFotos" aria-pressed="true">Fotos</button>
    <button id="btnEscala" aria-pressed="true">Zoom central</button>
    <button id="btnGeo" aria-pressed="true">Mapa</button>
    <button id="btnTema" aria-pressed="false">Noche</button>
    <button id="btnImagen">Guardar imagen</button>
    <button id="btnEstelas" aria-pressed="true">Estelas</button>
    <button id="btnSonido" aria-pressed="false">Aviso sonoro</button>
    <button id="btnQuiosco">Quiosco</button>
    <button id="btnLuz" aria-pressed="false">Pantalla encendida</button>
  </div>

</div>
<script>
// ============================================================
//  SOBRE MÍ · app
//  Posiciones: el Worker fusiona airplanes.live, adsb.lol y adsb.fi
//  Fichas, fotos y rutas: adsbdb.com
// ============================================================

// Se muestra en el pie: sirve para saber de un vistazo si lo que
// corre en el navegador es lo último que publicaste.
const VERSION = "18";

const CONFIG = {
  lat: 37.402935,
  lon: -5.957803,
  nombre: "Sevilla · 37.4029 N, 5.9578 O",
  // Radio que se PIDE al Worker. Siempre amplio: así nunca se pierde
  // nada por haber mirado poco, y cambiar el zoom no cuesta una
  // consulta nueva.
  radioConsultaKm: 150,

  // Radio que se MUESTRA. Solo cambia cómo se mira, no qué se recibe.
  radioKm: 50,

  // URL del Worker, sin barra final.
  proxy: "https://sobre-mi.mayoragustin01.workers.dev",

  refrescoMs: 15000,
  maxTiras: 12,
  maxFichasPorCiclo: 6,
  puntosEstela: 25,

  // Salta el aviso cuando algo va a pasar a menos de esta distancia
  // dentro de los próximos minutos.
  alertaKm: 3,
  alertaMinutos: 4,
  minutosGrafica: 30,

  // Una muestra de tráfico por minuto es suficiente para las
  // gráficas de historia y no engorda la base de datos.
  segundosEntreMuestras: 60,

  // Referencias en tierra. Los puntos son fiables; el trazado del
  // río es aproximado y está para situar, no para navegar: se afina
  // sacando coordenadas de un mapa y sustituyendo la lista.
  geografia: {
    puntos: [
      ["Sevilla", 37.3886, -5.9823], ["Triana", 37.3860, -6.0050],
      ["Camas", 37.4000, -6.0330], ["Santiponce", 37.4430, -6.0450],
      ["Tomares", 37.3740, -6.0480], ["San Juan", 37.3590, -6.0370],
      ["Mairena", 37.3390, -6.0700], ["Bormujos", 37.3730, -6.0780],
      ["Coria", 37.2860, -6.0530], ["Dos Hermanas", 37.2830, -5.9220],
      ["Alcalá", 37.3380, -5.8400], ["La Rinconada", 37.4870, -5.9770]
    ],
    rio: [
      [37.5200, -5.9600], [37.4700, -5.9750], [37.4300, -5.9900],

// --- Utilidades ---------------------------------------------

const $ = id => document.getElementById(id);
const RUMBOS = ["N","NE","E","SE","S","SO","O","NO"];

// Códigos de transpondedor con significado universal. Ver uno es
// rarísimo, y justo por eso merece salir en grande.
const EMERGENCIAS = {
  "7500": "secuestro", "7600": "fallo de radio", "7700": "emergencia general"
};
const octante = az => Math.round(az / 45) % 8;
const escapar = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// Proyección local plana: a 100 km el error sigue siendo de metros.
function proyectar(lat, lon) {
  return {
    x: (lon - CONFIG.lon) * 111.32 * Math.cos(CONFIG.lat * Math.PI / 180),
    y: (lat - CONFIG.lat) * 111.32
  };
}
const distancia = p => Math.hypot(p.x, p.y);
const acimut = p => (Math.atan2(p.x, p.y) * 180 / Math.PI + 360) % 360;

function formatoAltitud(pies) {
  if (pies >= 10000) return "FL" + String(Math.round(pies / 100)).padStart(3, "0");
  return Math.round(pies / 100) * 100 + " ft";
}

const aviso = t => $("aviso").innerHTML = t ? `<div class="aviso">${t}</div>` : "";

// Punto de máxima aproximación. Con la posición y el vector de
// velocidad se resuelve analíticamente: el instante en que la
// distancia es mínima es cuando la posición y la velocidad son
// perpendiculares. Es lo que de verdad responde a "¿me pasa por
// encima?", porque un avión lejano acercándose importa más que
// uno cercano que ya se va.
function calcularPaso(a) {
  const kmMin = a.nudos * 1.852 / 60;
  if (kmMin < 0.5) return null;

  const rad = a.rumbo * Math.PI / 180;
  const vx = Math.sin(rad) * kmMin;
  const vy = Math.cos(rad) * kmMin;

  const t = -(a.x * vx + a.y * vy) / (vx * vx + vy * vy);
  if (t < 0) return { alejandose: true };

  return {
    alejandose: false,
    minutos: t,
    km: Math.hypot(a.x + vx * t, a.y + vy * t)
  };
}

// --- Registro persistente -----------------------------------
//
// IndexedDB en vez de localStorage: aquí se acumulan miles de
// registros y localStorage se queda corto además de ser síncrono.
// Dos almacenes: uno con un registro por avión y día, otro con el
// recuento de tráfico muestreado cada minuto.

const BD_NOMBRE = "sobre-mi";
let bd = null;
let conocidos = new Set();
let ultimaMuestra = 0;

function abrirBD() {
  return new Promise((res, rej) => {
    const p = indexedDB.open(BD_NOMBRE, 1);
    p.onupgradeneeded = () => {
      const d = p.result;
      if (!d.objectStoreNames.contains("avistamientos")) {
        const s = d.createObjectStore("avistamientos", { keyPath: "id" });
        s.createIndex("fecha", "fecha");
        s.createIndex("icao24", "icao24");
      }
      if (!d.objectStoreNames.contains("muestras")) {
        d.createObjectStore("muestras", { keyPath: "t" });
      }
    };
    p.onsuccess = () => res(p.result);
    p.onerror = () => rej(p.error);
  });
}

const tx = (almacen, modo) => bd.transaction(almacen, modo).objectStore(almacen);

function leerTodo(almacen) {
  return new Promise((res, rej) => {
    const p = tx(almacen, "readonly").getAll();
    p.onsuccess = () => res(p.result);
    p.onerror = () => rej(p.error);
  });
}

const hoy = () => new Date().toISOString().slice(0, 10);

async function iniciarRegistro() {
  try {
    bd = await abrirBD();
    const previos = await leerTodo("avistamientos");
    conocidos = new Set(previos.map(r => r.icao24));
  } catch (e) {
    console.warn("sin registro persistente:", e);
    bd = null;
  }

  // El registro del servidor lleva grabando las 24 horas, así que es
  // la referencia buena para saber qué es nuevo de verdad. Sin esto,
  // "nuevo" solo significaría "nuevo para este navegador".
  try {
    const r = await fetch(CONFIG.proxy + "/registro/conocidos");
    if (r.ok) {
      const lista = await r.json();
      if (Array.isArray(lista)) {
        lista.forEach(i => conocidos.add(i));
        $("servidor").textContent = lista.length + " en el servidor";
      }
    }
  } catch (e) { /* sin servidor seguimos con el registro local */ }
}

// Un registro por avión y día: se va actualizando con el paso más
// cercano y el rango de altitudes en lugar de guardar cada muestra.
function registrar(lista) {
  if (!bd || !lista.length) return;

  const fecha = hoy(), ahora = Date.now();
  const almacen = bd.transaction("avistamientos", "readwrite").objectStore("avistamientos");

  for (const a of lista) {
    const id = fecha + ":" + a.icao24;
    const pet = almacen.get(id);
    pet.onsuccess = () => {
      const previo = pet.result;
      const f = a.ficha || {};
      const r = a.ruta;

      almacen.put({
        id, fecha, icao24: a.icao24,
        callsign: a.callsign || (previo && previo.callsign) || "",
        tipo: f.icaoTipo || (previo && previo.tipo) || "",
        modelo: f.tipo || (previo && previo.modelo) || "",
        matricula: f.matricula || (previo && previo.matricula) || "",
        operador: f.operador || (previo && previo.operador) || "",
        origen: (r && r.origen) || (previo && previo.origen) || "",
        destino: (r && r.destino) || (previo && previo.destino) || "",
        primera: previo ? previo.primera : ahora,
        ultima: ahora,
        minKm: previo ? Math.min(previo.minKm, a.distanciaKm) : a.distanciaKm,
        acimut: (!previo || a.distanciaKm < previo.minKm) ? a.acimut : previo.acimut,
        minPies: previo ? Math.min(previo.minPies, a.pies) : a.pies,
        maxPies: previo ? Math.max(previo.maxPies, a.pies) : a.pies,
        veces: (previo ? previo.veces : 0) + 1
      });
    };
    conocidos.add(a.icao24);
  }

  if (ahora - ultimaMuestra >= CONFIG.segundosEntreMuestras * 1000) {
    ultimaMuestra = ahora;
    bd.transaction("muestras", "readwrite").objectStore("muestras")
      .put({ t: ahora, n: lista.length });
  }
}

async function pedirAviones() {
  if (!CONFIG.proxy) throw new Error("falta CONFIG.proxy");
  const res = await fetch(
    `${CONFIG.proxy}/aviones?lat=${CONFIG.lat}&lon=${CONFIG.lon}` +
    `&km=${CONFIG.radioConsultaKm}`);
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
  fuenteActual = j.fuente || "";
  aportes = j.aportes || {};
  return j.aviones || [];
}

// "No hay aviones" y "nadie está escuchando" se ven igual desde
// aquí y significan cosas opuestas.
const hayCobertura = () =>
  Object.values(aportes).some(v => typeof v === "number" && v > 0);

async function pedirFicha(icao24) {
  if (fichas.has(icao24)) return fichas.get(icao24);
  try {
    const r = await fetch(`${CONFIG.proxy}/aircraft/${icao24}`);
    const j = await r.json();
    const a = j.response && j.response.aircraft;
    const f = a ? {
      tipo: a.type || "", icaoTipo: a.icao_type || "",
      matricula: a.registration || "", operador: a.registered_owner || "",
      pais: a.registered_owner_country_name || "",
      foto: a.url_photo_thumbnail || a.url_photo || ""
    } : null;
    fichas.set(icao24, f);
    return f;
  } catch (e) { return null; }
}

async function pedirRuta(callsign) {
  if (!callsign) return null;
  if (rutas.has(callsign)) return rutas.get(callsign);
  try {
    const r = await fetch(`${CONFIG.proxy}/route/${callsign}`);
    const j = await r.json();
    const f = j.response && j.response.flightroute;
    const v = f ? {
      origen: (f.origin && (f.origin.iata_code || f.origin.icao_code)) || "",
      destino: (f.destination && (f.destination.iata_code || f.destination.icao_code)) || "",
      origenNombre: (f.origin && f.origin.municipality) || "",
      destinoNombre: (f.destination && f.destination.municipality) || "",
      origenPais: (f.origin && f.origin.country_name) || "",
      destinoPais: (f.destination && f.destination.country_name) || ""
    } : null;
    rutas.set(callsign, v);
    return v;
  } catch (e) { return null; }
}

// --- Procesado ----------------------------------------------

function procesar(lista) {
  const salida = [];

  for (const a of lista) {
    if (a.enSuelo) continue;

    const p = proyectar(a.lat, a.lon);
    const d = distancia(p);
    if (d > CONFIG.radioConsultaKm) continue;

    // Las fuentes readsb traen tipo y matrícula con la posición, así
    // que la ficha básica ya viene hecha; solo la foto y el operador
    // requieren consultar.
    const inline = (a.tipo || a.matricula) ? {
      tipo: a.descripcion || a.tipo || "", icaoTipo: a.tipo || "",
      matricula: a.matricula || "", operador: "", pais: "", foto: ""
    } : null;

    const av = {
      icao24: a.icao24,
      callsign: a.callsign || "",
      x: p.x, y: p.y,
      distanciaKm: d,
      acimut: acimut(p),
      pies: a.altPies || 0,
      rumbo: a.rumbo || 0,
      subiendo: (a.vvPiesMin || 0) > 200,
      bajando: (a.vvPiesMin || 0) < -200,
      vv: a.vvPiesMin || 0,
      nudos: a.velNudos || 0,
      ficha: fichas.get(a.icao24) || inline,
      ruta: rutas.get(a.callsign || "") || null,
      tDato: Date.now(),
      novedad: !conocidos.has(a.icao24),
      squawk: a.squawk || "",
      emergencia: a.emergencia || (EMERGENCIAS[a.squawk] || null),
      militar: !!a.militar,
      helicoptero: !!a.helicoptero,
      interesante: !!a.interesante
    };
    av.paso = calcularPaso(av);
    salida.push(av);

    // Perfil de altitud de la sesión: permite ver el descenso de un
    // avión concreto en el panel de detalle.
    if (!alturas.has(a.icao24)) alturas.set(a.icao24, []);
    const alt = alturas.get(a.icao24);
    if (!alt.length || Math.abs(alt[alt.length - 1].pies - av.pies) > 40) {
      alt.push({ t: Date.now(), pies: av.pies });
      if (alt.length > 120) alt.shift();
    }

    if (!estelas.has(a.icao24)) estelas.set(a.icao24, []);
    const e = estelas.get(a.icao24);
    const ult = e[e.length - 1];
    if (!ult || Math.hypot(ult.x - p.x, ult.y - p.y) > 0.15) {
      e.push({ x: p.x, y: p.y });
      if (e.length > CONFIG.puntosEstela) e.shift();
    }
  }

  return salida.sort((a, b) => a.distanciaKm - b.distanciaKm);
}

async function enriquecer(lista) {
  let presupuesto = CONFIG.maxFichasPorCiclo;
  for (const a of lista.slice(0, CONFIG.maxTiras)) {
    if (presupuesto <= 0) break;
    if (a.callsign && !rutas.has(a.callsign)) {
      a.ruta = await pedirRuta(a.callsign);
      presupuesto--;
    } else if (a.callsign) a.ruta = rutas.get(a.callsign);
  }
}

// --- Avisos -------------------------------------------------

function pitar() {
  if (!sonido || !audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(880, audio.currentTime);
  g.gain.setValueAtTime(0.0001, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.18, audio.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.5);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.52);
}

const etiqueta = a => a.callsign || a.icao24.toUpperCase();

function revisarAlertas(lista) {
  const bandas = [];

  // 1. Emergencias declaradas. Es lo único que se salta cualquier
  //    otra consideración, así que va arriba y en negativo.
  for (const a of lista.filter(v => v.emergencia)) {
    bandas.push(`<div class="alerta urgente">
      <span class="grande">${escapar(etiqueta(a))}</span>
      <span class="chico">${escapar(a.emergencia)}
      ${a.squawk ? "· squawk " + escapar(a.squawk) : ""}
      · ${a.distanciaKm.toFixed(1)} km · ${formatoAltitud(a.pies)}</span></div>`);
    if (!avisados.has("e:" + a.icao24)) { avisados.add("e:" + a.icao24); pitar(); pitar(); }
  }

  // 2. Algo que va a pasar por encima.
  const cerca = lista.find(a => a.paso && !a.paso.alejandose &&
    a.paso.km <= CONFIG.alertaKm && a.paso.minutos <= CONFIG.alertaMinutos);
  if (cerca) {
    const m = cerca.paso.minutos;
    bandas.push(`<div class="alerta">
      <span class="grande">${escapar(etiqueta(cerca))}</span>
      <span class="chico">pasa a ${cerca.paso.km.toFixed(1)} km
      ${m < 1 ? "ahora mismo" : "en " + Math.round(m) + " min"}
      · ${formatoAltitud(cerca.pies)}</span></div>`);
    if (!avisados.has(cerca.icao24)) { avisados.add(cerca.icao24); pitar(); }
  }

  // 3. Récord de la sesión: el más cercano que has llegado a ver.
  const masCerca = lista.reduce((a, b) =>
    (!a || b.distanciaKm < a.distanciaKm) ? b : a, null);
  if (masCerca && (!record || masCerca.distanciaKm < record.km - 0.05)) {
    record = { km: masCerca.distanciaKm, etq: etiqueta(masCerca) };
    bandas.push(`<div class="alerta">
      <span class="grande">Récord</span>
      <span class="chico">${escapar(record.etq)} a ${record.km.toFixed(2)} km,
      lo más cerca de la sesión</span></div>`);
  }

  $("alerta").innerHTML = bandas.join("");
}

// --- Radar --------------------------------------------------
//
// El SVG se divide en tres capas: el fondo (anillos, rosa, mapa y
// pista) solo se redibuja cuando cambia la configuración, las
// estelas cuando llegan datos nuevos, y el tráfico en cada cuadro
// de animación. Así se puede interpolar a 15 fps sin rehacer todo.

const NS = "http://www.w3.org/2000/svg";
const crear = (t, attrs) => {
  const el = document.createElementNS(NS, t);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
};

// Los colores se leen del CSS en vez de estar escritos aquí: así el
// modo noche funciona sin duplicar la paleta en el JavaScript.
function colores() {
  const s = getComputedStyle(document.documentElement);
  const v = n => s.getPropertyValue(n).trim();
  return {
    papel: v("--papel"), hondo: v("--papel-hondo"), tinta: v("--tinta"),
    media: v("--tinta-media"), alta: v("--tinta-alta"), tenue: v("--tenue"),
    regla: v("--regla"), sello: v("--sello")
  };
}

function tintaPorAltitud(pies, C) {
  if (pies < 5000) return C.tinta;
  if (pies < 20000) return C.media;
  return C.alta;
}

const capa = id => {
  const svg = $("scope");
  let g = svg.querySelector("#" + id);
  if (!g) { g = crear("g", { id }); svg.appendChild(g); }
  g.innerHTML = "";
  return g;
};

const CX = 200, CY = 200, RAD = 168;
let escalaRaiz = true;

// Escala radial. En lineal, los primeros 25 km de un radar de 100
// ocupan solo un cuarto del dibujo y todo lo cercano se apelotona en
// el centro. Con raíz cuadrada esos mismos 25 km ocupan la mitad:
// se gana detalle cerca sin dejar de ver lo lejano.
function radioPantalla(km) {
  const f = Math.min(1, Math.max(0, km / CONFIG.radioKm));
  return (escalaRaiz ? Math.sqrt(f) : f) * RAD;
}

// Lleva un punto en kilómetros locales a coordenadas del dibujo.
function aPantalla(x, y) {
  const d = Math.hypot(x, y);
  if (d < 1e-9) return { x: CX, y: CY };
  const r = radioPantalla(d);
  return { x: CX + (x / d) * r, y: CY - (y / d) * r };
}

// Con escala no lineal una recta deja de serlo, así que las líneas
// largas (pista, ejes, río) se subdividen antes de transformarlas.
function trazo(puntos, subdiv = 1) {
  const salida = [];
  for (let i = 0; i < puntos.length - 1; i++) {
    const a = puntos[i], b = puntos[i + 1];
    for (let k = 0; k < subdiv; k++) {
      const t = k / subdiv;
      salida.push(aPantalla(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t));
    }
  }
  salida.push(aPantalla(puntos[puntos.length - 1].x, puntos[puntos.length - 1].y));
  return salida.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
}

// Anillos en valores redondos, no en fracciones del radio: leer
// "10 km" dice más que leer "un quinto de lo que has elegido".
function anillos() {
  const r = CONFIG.radioKm;
  if (r <= 30) return [5, 10, 20, 30];
  if (r <= 60) return [10, 25, 50, 60];
  if (r <= 120) return [10, 25, 50, 100];
  return [25, 50, 100, 200];
}

function dibujarFondo() {
  const C = colores();
  const g = capa("fondo");

  for (const km of anillos()) {
    if (km > CONFIG.radioKm) continue;
    const r = radioPantalla(km);
    g.appendChild(crear("circle", {
      cx: CX, cy: CY, r, fill: "none", stroke: C.regla,
      "stroke-width": km === CONFIG.radioKm ? 1 : .5,
      "stroke-dasharray": km === CONFIG.radioKm ? "none" : "2 3" }));
    const t = crear("text", { x: CX + 3, y: CY - r - 3,
      fill: C.tenue, "font-size": 8, "font-family": "monospace" });
    t.textContent = km + " km";
    g.appendChild(t);
  }
  g.appendChild(crear("circle", { cx: CX, cy: CY, r: RAD, fill: "none",
    stroke: C.regla, "stroke-width": 1 }));

  // Rosa de los vientos grabada: marca cada 30°, texto cada 45°.
  for (let d = 0; d < 360; d += 30) {
    const a = d * Math.PI / 180;
    const largo = d % 90 === 0 ? 13 : 6;
    g.appendChild(crear("line", {
      x1: CX + Math.sin(a) * (RAD - largo), y1: CY - Math.cos(a) * (RAD - largo),
      x2: CX + Math.sin(a) * RAD, y2: CY - Math.cos(a) * RAD,
      stroke: C.tenue, "stroke-width": d % 90 === 0 ? 1 : .5 }));
  }
  RUMBOS.forEach((r, i) => {
    const a = i * 45 * Math.PI / 180;
    const t = crear("text", {
      x: CX + Math.sin(a) * (RAD + 12), y: CY - Math.cos(a) * (RAD + 12) + 3,
      fill: C.tenue, "font-size": i % 2 ? 7.5 : 10,
      "font-family": "monospace", "text-anchor": "middle" });
    t.textContent = r;
    g.appendChild(t);
  });

  // Referencias en tierra: sin ellas el radar es un círculo abstracto.
  if (mostrarGeo) {
    // Aeropuertos y ciudades se dibujan estés donde estés: son la
    // única referencia cuando el radar no está sobre tu casa.
    for (const [nom, la, lo] of CONFIG.aeropuertosMapa) {
      const q = proyectar(la, lo);
      if (Math.hypot(q.x, q.y) > CONFIG.radioKm) continue;
      const p = aPantalla(q.x, q.y);
      // Marca de aeropuerto: un aspa, distinta del punto de ciudad.
      g.appendChild(crear("path", {
        d: `M${p.x - 3} ${p.y - 3}L${p.x + 3} ${p.y + 3}M${p.x - 3} ${p.y + 3}L${p.x + 3} ${p.y - 3}`,
        stroke: C.sello, "stroke-width": 1, "stroke-opacity": .7 }));
      const t = crear("text", { x: p.x + 5, y: p.y - 4, fill: C.sello,
        "font-size": 7.5, "font-family": "monospace", "font-weight": "700",
        "fill-opacity": .85 });
      t.textContent = nom;
      g.appendChild(t);
    }

    for (const [nom, la, lo] of CONFIG.ciudades) {
      const q = proyectar(la, lo);
      if (Math.hypot(q.x, q.y) > CONFIG.radioKm) continue;
      const p = aPantalla(q.x, q.y);
      g.appendChild(crear("circle", { cx: p.x, cy: p.y, r: 1.8,
        fill: C.tenue, "fill-opacity": .6 }));
      const t = crear("text", { x: p.x + 4, y: p.y + 3.5, fill: C.tenue,
        "font-size": 7, "font-family": "monospace", "fill-opacity": .8 });
      t.textContent = nom;
      g.appendChild(t);
    }
  }

  // El detalle fino —río y pueblos del área— solo tiene sentido en casa.
  if (mostrarGeo && sitio === "casa") {
    g.appendChild(crear("path", {
      d: trazo(CONFIG.geografia.rio.map(([la, lo]) => proyectar(la, lo)), 4),
      fill: "none", stroke: C.tinta, "stroke-width": 1.6, "stroke-opacity": .17,
      "stroke-linejoin": "round", "stroke-linecap": "round" }));

    for (const [nom, la, lo] of CONFIG.geografia.puntos) {
      const q = proyectar(la, lo);
      if (Math.hypot(q.x, q.y) > CONFIG.radioKm) continue;
      const p = aPantalla(q.x, q.y);
      g.appendChild(crear("circle", { cx: p.x, cy: p.y, r: 1.6,
        fill: C.tenue, "fill-opacity": .65 }));
      const t = crear("text", { x: p.x + 4, y: p.y + 3, fill: C.tenue,
        "font-size": 6.5, "font-family": "monospace", "fill-opacity": .8 });
      t.textContent = nom;
      g.appendChild(t);
    }
  }

  // Aeropuertos: la pista y su eje de aproximación prolongado. Es lo
  // que convierte el radar en un mapa: de golpe entiendes por qué el
  // tráfico se ordena en dos hilos y no al azar.
  for (const ae of (sitio === "casa" ? CONFIG.aeropuertos : [])) {
    const pa = proyectar(ae.lat, ae.lon);
    for (const pista of ae.pistas) {
      const rad = pista.rumbo * Math.PI / 180;
      const ux = Math.sin(rad), uy = Math.cos(rad);
      const mitad = pista.largoKm / 2;
      const enKm = k => ({ x: pa.x + ux * k, y: pa.y + uy * k });

      for (const signo of [1, -1]) {
        g.appendChild(crear("path", {
          d: trazo([enKm(signo * mitad), enKm(signo * (mitad + ae.ejeKm))], 10),
          fill: "none", stroke: C.sello, "stroke-width": .6, "stroke-opacity": .38,
          "stroke-dasharray": "5 4" }));
      }
      g.appendChild(crear("path", {
        d: trazo([enKm(-mitad), enKm(mitad)], 4),
        fill: "none", stroke: C.tinta, "stroke-width": 3.2, "stroke-linecap": "butt" }));
    }
    const etp = aPantalla(pa.x, pa.y);
    const et = crear("text", { x: etp.x, y: etp.y - 8,
      fill: C.sello, "font-size": 9, "font-family": "monospace",
      "font-weight": "700", "text-anchor": "middle" });
    et.textContent = ae.codigo;
    g.appendChild(et);
  }

  // Marca de casa.
  g.appendChild(crear("circle", { cx: CX, cy: CY, r: 3.5, fill: "none",
    stroke: C.sello, "stroke-width": 1.2 }));
  g.appendChild(crear("line", { x1: CX - 7, y1: CY, x2: CX + 7, y2: CY,
    stroke: C.sello, "stroke-width": .8 }));
  g.appendChild(crear("line", { x1: CX, y1: CY - 7, x2: CX, y2: CY + 7,
    stroke: C.sello, "stroke-width": .8 }));
}

function dibujarEstelas(aviones) {
  const g = capa("estelas");
  if (!mostrarEstelas) return;
  const C = colores();
  const activos = new Set(aviones.map(a => a.icao24));

  for (const [icao, pts] of estelas) {
    if (pts.length < 2) continue;
    g.appendChild(crear("path", {
      d: trazo(pts, 2),
      fill: "none", stroke: C.tinta,
      "stroke-width": activos.has(icao) ? .8 : .5,
      "stroke-opacity": activos.has(icao) ? .28 : .12,
      "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }
}

// Posición extrapolada: entre refresco y refresco se avanza el avión
// por su propio rumbo y velocidad. Se limita a 40 s para que, si se
// corta la conexión, no siga volando en línea recta indefinidamente.
function posicionAhora(a) {
  const dtMin = Math.min((Date.now() - a.tDato) / 60000, 40 / 60);
  if (!(dtMin > 0) || a.nudos < 30) return { x: a.x, y: a.y };
  const kmMin = a.nudos * 1.852 / 60;
  const rad = a.rumbo * Math.PI / 180;
  return { x: a.x + Math.sin(rad) * kmMin * dtMin,
           y: a.y + Math.cos(rad) * kmMin * dtMin };
}

function dibujarTrafico() {
  const g = capa("trafico");
  const C = colores();
  let fuera = 0;

  ultimos.forEach((a, i) => {
    const pos = posicionAhora(a);
    if (Math.hypot(pos.x, pos.y) > CONFIG.radioKm) { fuera++; return; }
    const p = aPantalla(pos.x, pos.y);
    const px = p.x, py = p.y;
    const esMarcado = a.icao24 === marcado;
    const color = esMarcado ? C.sello
      : a.emergencia ? C.sello : tintaPorAltitud(a.pies, C);
    const rad = a.rumbo * Math.PI / 180;

    // Vector de velocidad a un minuto vista, como en las pantallas de
    // control real: de un vistazo ves quién viene hacia ti.
    const kmMin = a.nudos * 1.852 / 60;
    const punta = aPantalla(pos.x + Math.sin(rad) * kmMin,
                            pos.y + Math.cos(rad) * kmMin);
    g.appendChild(crear("line", {
      x1: px, y1: py, x2: punta.x, y2: punta.y,
      stroke: color, "stroke-width": .7, "stroke-opacity": .8 }));

    const nodo = crear("g", {
      transform: `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${a.rumbo})` });
    nodo.appendChild(crear("path", { d: "M0 -6 L4 5 L0 2.5 L-4 5 Z", fill: color }));
    g.appendChild(nodo);

    if (a.militar || a.helicoptero || a.emergencia) {
      g.appendChild(crear("circle", { cx: px, cy: py, r: 8, fill: "none",
        stroke: color, "stroke-width": .7, "stroke-opacity": .55 }));
    }

    const limite = document.documentElement.hasAttribute("data-quiosco") ? 8 : 3;
    if (i < limite || esMarcado) {
      const et = crear("text", { x: px + 8, y: py + 3, fill: color,
        "font-size": 8.5, "font-family": "monospace",
        "font-weight": esMarcado ? "700" : "400" });
      et.textContent = a.callsign || a.icao24.toUpperCase();
      g.appendChild(et);
    }
  });

  if (fuera) {
    const C2 = colores();
    const t = crear("text", { x: CX, y: 393, fill: C2.tenue, "font-size": 8,
      "font-family": "monospace", "text-anchor": "middle" });
    t.textContent = `${fuera} más allá de ${CONFIG.radioKm} km`;
    g.appendChild(t);
  }
}

// Bucle de interpolación. A 15 cuadros por segundo el movimiento ya
// se percibe continuo y el coste es despreciable; más no aporta nada
// porque el dato de origen solo cambia cada 15 segundos.
function bucle(ahora) {
  if (!animando) return;
  if (ahora - ultimoCuadro > 66) { ultimoCuadro = ahora; dibujarTrafico(); }
  requestAnimationFrame(bucle);
}

function animar(activo) {
  const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  animando = activo && !quieto;
  if (animando) requestAnimationFrame(bucle);
}

// --- Gráfica de tráfico -------------------------------------

function dibujarGrafica() {
  const svg = $("grafica");
  svg.innerHTML = "";
  if (historial.length < 2) return;

  const corte = Date.now() - CONFIG.minutosGrafica * 60000;
  const pts = historial.filter(p => p.t >= corte);
  if (pts.length < 2) return;

  const C = colores();
  const max = Math.max(4, ...pts.map(p => p.n));
  const t0 = pts[0].t, t1 = Date.now();
  const ancho = 400, alto = 44;

  const x = p => ((p.t - t0) / Math.max(1, t1 - t0)) * ancho;
  const y = p => alto - 2 - (p.n / max) * (alto - 6);

  // Relleno bajo la curva, como un registro en papel milimetrado.
  const area = `M ${x(pts[0]).toFixed(1)} ${alto} ` +
    pts.map(p => `L ${x(p).toFixed(1)} ${y(p).toFixed(1)}`).join(" ") +
    ` L ${x(pts[pts.length - 1]).toFixed(1)} ${alto} Z`;
  svg.appendChild(crear("path", { d: area, fill: C.tinta, "fill-opacity": .1 }));

  svg.appendChild(crear("path", {
    d: pts.map((p, i) => (i ? "L" : "M") + x(p).toFixed(1) + " " + y(p).toFixed(1)).join(" "),
    fill: "none", stroke: C.tinta, "stroke-width": 1.2,
    "stroke-linejoin": "round", "stroke-linecap": "round" }));

  $("chispaMax").textContent = "máx " + max;
}

// Perfil de altitud de la sesión: con dos o tres minutos de datos
// ya se ve si viene bajando en escalones o mantiene nivel.
function perfilAltitud(icao24) {
  const pts = alturas.get(icao24) || [];
  if (pts.length < 3) return "";

  const min = Math.min(...pts.map(p => p.pies));
  const max = Math.max(...pts.map(p => p.pies));
  if (max - min < 150) return "";

  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  const W = 380, H = 46;
  const x = p => ((p.t - t0) / Math.max(1, t1 - t0)) * W;
  const y = p => H - 3 - ((p.pies - min) / (max - min)) * (H - 8);

  const d = pts.map((p, i) => (i ? "L" : "M") +
    x(p).toFixed(1) + " " + y(p).toFixed(1)).join(" ");

  return `<div class="perfil">
    <div class="k">Perfil de altitud · ${formatoAltitud(min)} a ${formatoAltitud(max)}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${d}" fill="none" stroke="var(--sello)" stroke-width="1.4"
            stroke-linejoin="round" stroke-linecap="round"/>
    </svg></div>`;
}

// --- Tiras --------------------------------------------------

function textoRuta(a) {
  if (a.ruta && a.ruta.origen && a.ruta.destino) {
    const l = [a.ruta.origenNombre, a.ruta.destinoNombre].filter(Boolean);
    const sub = l.length === 2
      ? `<span class="lugar">${escapar(l[0])} · ${escapar(l[1])}</span>` : "";
    return `${escapar(a.ruta.origen)} → ${escapar(a.ruta.destino)}${sub}`;
  }
  if (a.ficha && a.ficha.operador) return escapar(a.ficha.operador);
  return escapar(a.callsign || a.icao24.toUpperCase());
}

function marcas(a) {
  let s = "";
  if (a.emergencia) s += `<span class="marca m-raro">${escapar(a.emergencia)}</span>`;
  if (a.militar) s += `<span class="marca m-mil">militar</span>`;
  if (a.helicoptero) s += `<span class="marca m-heli">heli</span>`;
  if (a.interesante && !a.militar) s += `<span class="marca m-raro">raro</span>`;
  if (a.novedad) s += `<span class="nuevo">nuevo</span>`;
  return s;
}

function textoMaquina(a) {
  if (!a.ficha) return "identificando…";
  return escapar([a.ficha.tipo || a.ficha.icaoTipo, a.ficha.matricula, a.ficha.operador]
    .filter(Boolean).join(" · ")) || "sin ficha";
}

    const paso = a.paso && !a.paso.alejandose
      ? `<span class="paso">↓ ${a.paso.km.toFixed(1)} km en ` +
        `${a.paso.minutos < 1 ? "<1" : Math.round(a.paso.minutos)} min</span>`

        <div class="telemetria">
          ${escapar(a.callsign || "—")} &nbsp;·&nbsp; ${formatoAltitud(a.pies)} ${tend}
          &nbsp;·&nbsp; ${Math.round(a.nudos)} kt &nbsp;·&nbsp; ${paso}
        </div>
      </div>
      <div class="medida">
        <div class="km">${a.distanciaKm.toFixed(1)}</div>
        <div class="rumbo">km ${RUMBOS[octante(a.acimut)]}</div>
      </div>`;

    const alternar = () => {

}

// --- Modo espectador ----------------------------------------
//
// En quiosco, cuando nadie toca nada, se van pasando cromos de los
// aviones que merecen la pena. La selección no es aleatoria: rota
// entre criterios distintos para que no salga siempre el mismo.

let espTemporizador = null, espInactivo = null, espIndice = 0;
const ESP_ESPERA = 45000;   // sin tocar nada
const ESP_PASE = 14000;     // cada cromo

const CRITERIOS = [
  ["El más cercano", l => l.slice().sort((a, b) => a.distanciaKm - b.distanciaKm)[0]],
  ["Nunca visto", l => l.find(a => a.novedad)],
  ["Poco común", l => l.find(a => a.militar || a.helicoptero || a.interesante)],
  ["El más alto", l => l.slice().sort((a, b) => b.pies - a.pies)[0]],
  ["Va a pasar cerca", l => l.slice()
    .filter(a => a.paso && !a.paso.alejandose)
    .sort((a, b) => a.paso.km - b.paso.km)[0]],
  ["El más rápido", l => l.slice().sort((a, b) => b.nudos - a.nudos)[0]]
];

async function pase() {
  const caja = $("espectador");
  if (!ultimos.length) { caja.classList.remove("visible"); return; }

  // Se recorren los criterios hasta encontrar uno que dé resultado.
  let elegido = null, motivo = "";
  for (let i = 0; i < CRITERIOS.length; i++) {
    const [nom, fn] = CRITERIOS[(espIndice + i) % CRITERIOS.length];
    const a = fn(ultimos);
    if (a) { elegido = a; motivo = nom; espIndice = (espIndice + i + 1) % CRITERIOS.length; break; }
  }
  if (!elegido) return;

  const f = elegido.ficha || {};
  const r = elegido.ruta;

  caja.innerHTML = `
    <div class="lamina" id="espFoto"><span>—</span></div>
    <div class="texto">
      <div class="motivo">${escapar(motivo)}</div>
      <h2>${escapar(elegido.callsign || elegido.icao24.toUpperCase())}</h2>
      <div class="mod">${escapar(f.tipo || f.icaoTipo || "")}
        ${f.matricula ? " · " + escapar(f.matricula) : ""}</div>
      ${r && r.origen ? `<div class="ruta">${escapar(r.origenNombre || r.origen)}
        → ${escapar(r.destinoNombre || r.destino)}</div>` : ""}
      <div class="datos">
        <div><small>Distancia</small>${elegido.distanciaKm.toFixed(1)} km</div>
        <div><small>Altitud</small>${formatoAltitud(elegido.pies)}</div>
        <div><small>Velocidad</small>${Math.round(elegido.nudos)} kt</div>
        <div><small>Rumbo</small>${RUMBOS[octante(elegido.acimut)]}</div>
      </div>
    </div>`;
  caja.classList.add("visible");

  // La foto se pide después de pintar: si tarda o no existe, el
  // cromo ya está en pantalla igualmente.
  const ficha = fichas.has(elegido.icao24)
    ? fichas.get(elegido.icao24) : await pedirFicha(elegido.icao24);
  if (caja.classList.contains("visible")) {
    const marco = $("espFoto");
    if (marco) {
      const img = new Image();
      img.referrerPolicy = "no-referrer";
      img.onload = () => { marco.innerHTML = ""; marco.appendChild(img); };
      img.onerror = () => { marco.innerHTML = "<span>sin foto</span>"; };
      img.src = CONFIG.proxy + "/foto/" + elegido.icao24;
    }
  }
}

function pararEspectador() {
  clearInterval(espTemporizador); espTemporizador = null;
  $("espectador").classList.remove("visible");
}

function reiniciarInactividad() {
  pararEspectador();
  clearTimeout(espInactivo);
  if (!document.documentElement.hasAttribute("data-quiosco")) return;
  espInactivo = setTimeout(() => {
    pase();
    espTemporizador = setInterval(pase, ESP_PASE);
  }, ESP_ESPERA);
}

["pointerdown", "keydown"].forEach(ev =>
  document.addEventListener(ev, reiniciarInactividad, { passive: true }));

// --- Ciclo --------------------------------------------------

// El radar siempre enseña todo; el filtro solo afecta a la lista,
// que es donde la saturación estorba de verdad.
function filtrar(lista) {
  lista = lista.filter(a => a.distanciaKm <= CONFIG.radioKm);
  switch (filtro) {
    case "bajos": return lista.filter(a => a.pies < 10000);
    case "acercandose": return lista.filter(a => a.paso && !a.paso.alejandose);
    case "raros": return lista.filter(a => a.militar || a.helicoptero || a.interesante);
    case "nuevos": return lista.filter(a => a.novedad);
    default: return lista;
  }
}

function refrescarVista() {
  dibujarFondo();
  dibujarEstelas(ultimos);
  dibujarTrafico();
  dibujarDetalle();
  dibujarTiras(filtrar(ultimos));
  dibujarGrafica();
}

function resumenVistos() {
  const n = vistos.size;
  const top = [...tipos.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([t, c]) => `${t}×${c}`).join(" ");
  return n + " vistos" + (top ? " · " + top : "");
}

async function ciclo() {
  try {
    $("estado").textContent = "consultando";
    const lista = procesar(await pedirAviones());
    await enriquecer(lista);

    lista.forEach(a => {
      vistos.set(a.icao24, a.callsign || a.icao24);
      const t = a.ficha && a.ficha.icaoTipo;
      if (t && !vistos.has(a.icao24 + ":t")) {
        vistos.set(a.icao24 + ":t", 1);
        tipos.set(t, (tipos.get(t) || 0) + 1);
      }
    });

    ultimos = lista;
    historial.push({ t: Date.now(), n: lista.length });
    if (historial.length > 400) historial.shift();

    // Los avisados se limpian cuando el avión ya no está, para que
    // el mismo vuelo no pite dos veces pero otro distinto sí pueda.
    const presentes = new Set(lista.map(a => a.icao24));
    avisados = new Set([...avisados].filter(i => presentes.has(i)));

    $("cuenta").textContent = hayCobertura()
      ? lista.length + " en el aire · " + fuenteActual : "sin cobertura";
    $("vistos").textContent = resumenVistos();
    $("punto").classList.add("vivo");
    $("estado").textContent = new Date().toLocaleTimeString("es-ES",
      { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    aviso("");

    registrar(lista);
    revisarAlertas(lista);
    refrescarVista();

  } catch (e) {
    console.error(e);
    $("punto").classList.remove("vivo");
    $("estado").textContent = "sin datos";
    aviso(CONFIG.proxy
      ? `El Worker no ha devuelto datos: ${escapar(e.message)}. Abre /diag ` +
        `para ver qué fuentes responden.`
      : "Esta copia no tiene CONFIG.proxy relleno. Si ya lo rellenaste, el " +
        "navegador sirve una versión en caché: recarga añadiendo ?v=" +
        VERSION + " al final de la URL.");
  }
}

// --- Controles ----------------------------------------------

// Cambiar el radio ya no pide datos otra vez: la consulta siempre
// es amplia y esto solo decide hasta dónde se mira.
$("radio").addEventListener("change", e => {
  CONFIG.radioKm = Number(e.target.value);
  refrescarVista();
});

$("filtro").addEventListener("change", e => {
  filtro = e.target.value;
  refrescarVista();
});

// Exportar el radar como PNG: el SVG se serializa, se pinta sobre
// el color de papel y se descarga. Sirve para guardar el dibujo de
// un día entero de estelas.
$("btnImagen").addEventListener("click", () => {
  const svg = $("scope");
  const texto = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([texto], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const img = new Image();

  img.onload = () => {
    const L = 1200;
    const lienzo = document.createElement("canvas");
    lienzo.width = lienzo.height = L;
    const c = lienzo.getContext("2d");
    const C = colores();
    c.fillStyle = C.papel;
    c.fillRect(0, 0, L, L);
    c.drawImage(img, 0, 0, L, L);

    c.fillStyle = C.tenue;
    c.font = "20px ui-monospace, monospace";
    c.fillText(new Date().toLocaleString("es-ES") + "  ·  " +
               CONFIG.radioKm + " km  ·  sobre mí", 24, L - 24);

    lienzo.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = "radar-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".png";
      a.click();
      URL.revokeObjectURL(a.href);
    });
    URL.revokeObjectURL(url);
  };

  img.onerror = () => { URL.revokeObjectURL(url); alert("No se ha podido generar la imagen."); };
  img.src = url;
});

function marcarSitio() {
  $("bCasa").setAttribute("aria-pressed", String(sitio === "casa"));
  $("bAqui").setAttribute("aria-pressed", String(sitio === "aqui"));
  marcarSitio();
}

function irA(lat, lon, nombre, cual) {
  CONFIG.lat = lat; CONFIG.lon = lon; CONFIG.nombre = nombre;
  sitio = cual;
  estelas.clear(); alturas.clear(); marcado = null;
  marcarSitio();
  ciclo();
}

$("bCasa").addEventListener("click", () =>
  irA(CASA.lat, CASA.lon, CASA.nombre, "casa"));

$("bAqui").addEventListener("click", () => {
  if (!navigator.geolocation) { aviso("Este navegador no da ubicación."); return; }
  $("bAqui").textContent = "Buscando…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      $("bAqui").textContent = "Dónde estoy";
      irA(pos.coords.latitude, pos.coords.longitude,
          `Aquí · ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`,
          "aqui");
    },
    err => {
      $("bAqui").textContent = "Dónde estoy";
      aviso("No se ha podido obtener la ubicación: " + err.message);
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
});

// El quiosco intenta pantalla completa y mantener el retroiluminado.
// Si el navegador no deja, se queda en la vista limpia igualmente.
async function quiosco(activo) {
  document.documentElement.toggleAttribute("data-quiosco", activo);
  if (activo) reiniciarInactividad(); else { pararEspectador(); clearTimeout(espInactivo); }
  try {
    if (activo && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    } else if (!activo && document.fullscreenElement) {
      await document.exitFullscreen();
    }
  } catch (e) { /* iOS no siempre lo permite */ }

  if (activo && !wakeLock && navigator.wakeLock) {
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      $("btnLuz").setAttribute("aria-pressed", "true");
    } catch (e) { /* da igual */ }
  }
  refrescarVista();
}

$("btnQuiosco").addEventListener("click", () => quiosco(true));
$("btnQuiosco2").addEventListener("click", () => quiosco(true));
$("salirQuiosco").addEventListener("click", () => quiosco(false));

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.documentElement.hasAttribute("data-quiosco")) {
    quiosco(false);
  }
});

// Se puede entrar directamente con ?quiosco al final de la URL, que
// es lo cómodo para dejarlo fijo en un dispositivo de sobremesa.
if (new URLSearchParams(location.search).has("quiosco")) quiosco(true);

$("btnFotos").addEventListener("click", e => {
  mostrarFotos = !mostrarFotos;
  e.target.setAttribute("aria-pressed", String(mostrarFotos));
  refrescarVista();
});

$("btnEscala").addEventListener("click", e => {
  escalaRaiz = !escalaRaiz;
  e.target.setAttribute("aria-pressed", String(escalaRaiz));
  refrescarVista();
});

$("btnGeo").addEventListener("click", e => {
  mostrarGeo = !mostrarGeo;
  e.target.setAttribute("aria-pressed", String(mostrarGeo));
  dibujarFondo();
});

function aplicarTema(noche) {
  document.documentElement.setAttribute("data-tema", noche ? "noche" : "dia");
  $("btnTema").setAttribute("aria-pressed", String(noche));
  $("btnTema").textContent = noche ? "Día" : "Noche";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", colores().papel);
  refrescarVista();
}

$("btnTema").addEventListener("click", () => {
  aplicarTema(document.documentElement.getAttribute("data-tema") !== "noche");
});

$("btnEstelas").addEventListener("click", e => {
  mostrarEstelas = !mostrarEstelas;
  e.target.setAttribute("aria-pressed", String(mostrarEstelas));
  dibujarEstelas(ultimos);
});

// El audio necesita un gesto del usuario para arrancar: iOS no deja
// crear el contexto de otra forma.
$("btnSonido").addEventListener("click", e => {
  sonido = !sonido;
  e.target.setAttribute("aria-pressed", String(sonido));
  if (sonido && !audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (err) { sonido = false; e.target.disabled = true;
                  e.target.textContent = "Sin audio"; return; }
  }
  if (sonido) pitar();
});

$("btnLuz").addEventListener("click", async e => {
  try {
    if (wakeLock) {
      await wakeLock.release(); wakeLock = null;
      e.target.setAttribute("aria-pressed", "false");
    } else {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => {
        wakeLock = null; e.target.setAttribute("aria-pressed", "false");
      });
      e.target.setAttribute("aria-pressed", "true");
    }
  } catch (err) {
    e.target.textContent = "No disponible"; e.target.disabled = true;
  }
});

document.addEventListener("visibilitychange", () => {
  const visible = document.visibilityState === "visible";
  animar(visible);
  if (visible) ciclo();
});

// --- Arranque -----------------------------------------------

// Arranca siempre de día. El modo noche queda a un toque, pero no se
// hereda del sistema: esta app se mira sobre todo con luz.
aplicarTema(false);
animar(true);

$("sitio").textContent = CONFIG.nombre;
$("version").textContent = "v" + VERSION + " · " +
  (CONFIG.proxy ? "worker ok" : "SIN PROXY");
if (!CONFIG.proxy) $("version").style.color = "var(--sello)";

// El registro se abre antes del primer ciclo para que la marca de
// "nuevo" sea fiable desde el primer avión.
iniciarRegistro().then(() => {
  ciclo();
  setInterval(ciclo, CONFIG.refrescoMs);
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
